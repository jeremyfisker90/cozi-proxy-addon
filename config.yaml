name: "Cozi Proxy API"
version: "1.20.5"
slug: "cozi_proxy2"
description: "Local API bridge for Cozi To-Do lists"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
host_network: true
homeassistant_api: true

# User-configurable options (shown in Supervisor UI).
# cozi_enabled: false (or blank credentials) runs the chores engine in
# Google/sheet-only mode — no Cozi login, no Cozi list mirroring.
options:
  username: ""
  password: ""
  cozi_enabled: true
  # --- chore texting (optional). Texts go out through your carrier's
  # email-to-SMS gateway, sent from a Gmail account via an app password
  # (Google Account -> Security -> 2-Step Verification -> App passwords).
  # Leave smtp_user/smtp_pass blank to disable texting entirely.
  smtp_user: ""
  smtp_pass: ""
  sms_gateway: "vtext.com"     # Verizon. AT&T: txt.att.net, T-Mobile: tmomail.net
  phone_ian: ""
  phone_evan: ""
  phone_mom: ""
  phone_dad: ""
  timezone: "America/New_York"
  # --- voice intents (optional). Maps what people are *called* out loud to the
  # names on your Cozi household, for "create an appointment for mom...".
  # Format: "mom=Jane, dad=John". Leave blank if the spoken names match Cozi.
  voice_aliases: ""
  # --- Google Calendar mirror (optional). Comma-separated Home Assistant
  # calendar entity ids to copy new events from into Cozi — this is what makes
  # "Hey Google, create an event..." land on the family calendar. The first
  # pass only records what is already there, so nothing backfills. Set
  # mirror_prefix (e.g. "cozi") to copy only titles that start with that word.
  mirror_calendars: ""
  mirror_days: 60
  mirror_prefix: ""

# Schema for the add-on configuration UI
schema:
  username: str
  password: str
  cozi_enabled: bool
  smtp_user: str
  smtp_pass: password
  sms_gateway: str
  phone_ian: str
  phone_evan: str
  phone_mom: str
  phone_dad: str
  timezone: str
  voice_aliases: str
  mirror_calendars: str
  mirror_days: int
  mirror_prefix: str

# No need for environment variables anymore
environment: {}

ports:
  5000/tcp: 5000